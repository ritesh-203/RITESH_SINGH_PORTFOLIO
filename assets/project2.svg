<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Grad)" />

  <!-- IDE Window -->
  <rect x="25" y="20" width="550" height="320" rx="12" fill="#0c101c" stroke="#312e81" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="20" width="550" height="38" rx="12" fill="#080c16" />
  <circle cx="45" cy="39" r="5" fill="#ef4444" />
  <circle cx="62" cy="39" r="5" fill="#f59e0b" />
  <circle cx="79" cy="39" r="5" fill="#10b981" />
  
  <rect x="110" y="27" width="130" height="24" rx="6" fill="#151b2e" />
  <text x="125" y="43" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Portfolio.tsx</text>
  <rect x="250" y="27" width="110" height="24" rx="6" fill="transparent" />
  <text x="260" y="43" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Terminal.sh</text>

  <!-- Left Sidebar Mini Files -->
  <rect x="25" y="58" width="45" height="282" fill="#070a12" />
  <rect x="37" y="70" width="20" height="20" rx="4" fill="#38bdf8" opacity="0.3" />
  <rect x="37" y="105" width="20" height="20" rx="4" fill="#818cf8" opacity="0.3" />
  <rect x="37" y="140" width="20" height="20" rx="4" fill="#64748b" opacity="0.2" />

  <!-- Code Editor Content -->
  <g transform="translate(85, 75)">
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8"><tspan fill="#ec4899">const</tspan> Developer = {</text>
    <text x="20" y="38" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">name: <tspan fill="#38bdf8">"Ritesh Singh"</tspan>,</text>
    <text x="20" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">role: <tspan fill="#38bdf8">"Upcoming Developer"</tspan>,</text>
    <text x="20" y="78" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">education: <tspan fill="#a855f7">"B.Tech (GL Bajaj)"</tspan>,</text>
    <text x="20" y="98" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">skills: [<tspan fill="#4ade80">"C++"</tspan>, <tspan fill="#4ade80">"DSA"</tspan>, <tspan fill="#4ade80">"JavaScript"</tspan>, <tspan fill="#4ade80">"Tailwind"</tspan>],</text>
    <text x="20" y="118" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">status: <tspan fill="#38bdf8">"Ready for Internships &amp; Roles"</tspan></text>
    <text x="0" y="138" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8">};</text>

    <!-- Embedded Terminal in lower half -->
    <rect x="-5" y="155" width="485" height="100" rx="8" fill="#05070d" stroke="#1e293b" stroke-width="1" />
    <rect x="-5" y="155" width="485" height="22" rx="8" fill="#0d1322" />
    <text x="10" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">bash - ritesh@dev-env:~</text>
    
    <text x="10" y="195" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">ritesh@dev:~$ <tspan fill="#f8fafc">git commit -m "feat: ship dream portfolio"</tspan></text>
    <text x="10" y="215" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">[main 7e89ab2] 12 files changed, 100% test pass rate</text>
    <text x="10" y="235" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a855f7">🚀 Successfully deployed to production!</text>
  </g>
</svg>
