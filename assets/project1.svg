<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="activeBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p1Grad)" />
  
  <!-- Browser Window Frame -->
  <rect x="25" y="20" width="550" height="320" rx="12" fill="#151d2f" stroke="#1e293b" stroke-width="1.5" />
  <!-- Window Header -->
  <rect x="25" y="20" width="550" height="38" rx="12" fill="#0f172a" />
  <circle cx="45" cy="39" r="5" fill="#ef4444" />
  <circle cx="62" cy="39" r="5" fill="#f59e0b" />
  <circle cx="79" cy="39" r="5" fill="#10b981" />
  <rect x="130" y="29" width="340" height="20" rx="5" fill="#1e293b" />
  <text x="210" y="43" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">algoverse.visualizer.dev</text>

  <!-- Sidebar / Controls -->
  <rect x="35" y="68" width="130" height="260" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="48" y="95" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#38bdf8">ALGORITHMS</text>
  <rect x="45" y="110" width="110" height="24" rx="4" fill="#1e293b" />
  <text x="55" y="126" font-family="'Inter', sans-serif" font-size="10" fill="#f8fafc">Quick Sort (Active)</text>
  <text x="55" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Merge Sort</text>
  <text x="55" y="174" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Dijkstra's Path</text>
  <text x="55" y="196" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Binary Search</text>
  
  <rect x="45" y="225" width="110" height="26" rx="6" fill="#3b82f6" />
  <text x="68" y="242" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffffff">▶ Run Visualizer</text>
  
  <rect x="45" y="260" width="110" height="22" rx="4" fill="#1e293b" />
  <text x="52" y="275" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">O(N log N) - O(N)</text>

  <!-- Visualizer Bars Canvas -->
  <g transform="translate(180, 75)">
    <rect width="380" height="245" rx="8" fill="#070c18" stroke="#1e293b" stroke-width="1" />
    
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="380" y2="50" stroke="#1e293b" stroke-dasharray="3 3" />
    <line x1="0" y1="110" x2="380" y2="110" stroke="#1e293b" stroke-dasharray="3 3" />
    <line x1="0" y1="170" x2="380" y2="170" stroke="#1e293b" stroke-dasharray="3 3" />

    <!-- Sorting Bars -->
    <rect x="20" y="160" width="14" height="75" rx="3" fill="url(#barGrad)" />
    <rect x="42" y="130" width="14" height="105" rx="3" fill="url(#barGrad)" />
    <rect x="64" y="90" width="14" height="145" rx="3" fill="url(#barGrad)" />
    <rect x="86" y="180" width="14" height="55" rx="3" fill="url(#barGrad)" />
    <rect x="108" y="50" width="14" height="185" rx="3" fill="url(#barGrad)" />
    <!-- Active Compare Bars -->
    <rect x="130" y="70" width="14" height="165" rx="3" fill="url(#activeBarGrad)" />
    <rect x="152" y="110" width="14" height="125" rx="3" fill="url(#activeBarGrad)" />
    <rect x="174" y="140" width="14" height="95" rx="3" fill="url(#barGrad)" />
    <rect x="196" y="60" width="14" height="175" rx="3" fill="url(#barGrad)" />
    <rect x="218" y="150" width="14" height="85" rx="3" fill="url(#barGrad)" />
    <rect x="240" y="100" width="14" height="135" rx="3" fill="url(#barGrad)" />
    <rect x="262" y="40" width="14" height="195" rx="3" fill="url(#barGrad)" />
    <rect x="284" y="125" width="14" height="110" rx="3" fill="url(#barGrad)" />
    <rect x="306" y="80" width="14" height="155" rx="3" fill="url(#barGrad)" />
    <rect x="328" y="170" width="14" height="65" rx="3" fill="url(#barGrad)" />
    <rect x="350" y="30" width="14" height="205" rx="3" fill="url(#barGrad)" />

    <!-- Metric Overlay Pill -->
    <rect x="15" y="15" width="170" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Swaps: 412 | Compares: 890</text>
  </g>
</svg>
