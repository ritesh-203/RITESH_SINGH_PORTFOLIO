<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Certificate Card -->
  <rect width="600" height="380" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <rect x="15" y="15" width="570" height="350" rx="10" fill="#ffffff" />

  <!-- Top System Header Bar -->
  <rect x="15" y="15" width="570" height="36" rx="8" fill="#f8fafc" />
  <line x1="15" y1="51" x2="585" y2="51" stroke="#e2e8f0" stroke-width="1" />
  <text x="35" y="38" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#0043ce">IBM SkillsBuild</text>
  <text x="235" y="38" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">Completion Certificate</text>

  <!-- Gold Ribbon Medal on Left -->
  <g transform="translate(38, 70)">
    <circle cx="18" cy="18" r="16" fill="none" stroke="url(#goldSeal)" stroke-width="4" />
    <circle cx="18" cy="18" r="11" fill="none" stroke="url(#goldSeal)" stroke-width="1.5" />
    <path d="M12 32 L8 50 L18 44 L28 50 L24 32" fill="url(#goldSeal)" opacity="0.85" />
  </g>

  <!-- Subtitle -->
  <text x="300" y="88" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">This certificate is presented to</text>

  <!-- Recipient Name -->
  <text x="300" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#0f172a">Ritesh Singh</text>

  <text x="300" y="165" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">for the completion of</text>

  <!-- Lab Title -->
  <text x="300" y="202" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#0f62fe">Lab: Troubleshoot Your Code Using IBM Bob</text>

  <!-- Course ID & System Verification -->
  <text x="300" y="228" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">(ALM-COURSE_4071307)</text>
  <text x="300" y="246" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">According to the Adobe Learning Manager system of record</text>

  <!-- Bottom Dark Metadata Bar (as shown in actual certificate) -->
  <g transform="translate(15, 318)">
    <rect width="570" height="47" rx="0" fill="#71717a" opacity="0.95" />
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Completion date: <tspan font-weight="400">18 Aug 2026 (GMT)</tspan></text>
    <text x="440" y="28" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Learning hours: <tspan font-weight="400">30 mins</tspan></text>
  </g>
</svg>
