<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ibmBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="100%" stop-color="#002d9c" />
    </linearGradient>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f7fb" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0043ce" />
      <stop offset="100%" stop-color="#1192e8" />
    </linearGradient>
  </defs>

  <!-- Outer Navy Frame (Matches actual PDF screenshot) -->
  <rect width="600" height="380" rx="14" fill="#0f4c81" />
  
  <!-- Inner White Certificate Card -->
  <rect x="22" y="20" width="556" height="340" rx="6" fill="url(#certBg)" stroke="#d0e2ff" stroke-width="1.5" />

  <!-- Top Blue Accent Header -->
  <text x="45" y="55" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#161616">In recognition of the commitment to achieve</text>
  <text x="45" y="73" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#161616">professional excellence</text>

  <!-- Top-Right Mini Badge Box -->
  <g transform="translate(455, 35)">
    <rect width="105" height="48" rx="4" fill="#e0f2fe" stroke="#0043ce" stroke-width="1" />
    <rect width="105" height="14" rx="4" fill="#0043ce" />
    <text x="8" y="10" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#ffffff">IBM SkillsBuild</text>
    <text x="8" y="27" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#0043ce">Artificial</text>
    <text x="8" y="37" font-family="'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#0043ce">Intelligence</text>
  </g>

  <!-- Student Name -->
  <text x="45" y="145" font-family="'Inter', sans-serif" font-weight="800" font-size="30" fill="#161616">Ritesh Singh</text>

  <!-- Criteria text -->
  <text x="45" y="185" font-family="'Inter', sans-serif" font-size="11" fill="#525252">Has successfully satisfied the requirements for:</text>

  <!-- Course Title -->
  <text x="45" y="228" font-family="'Inter', sans-serif" font-weight="700" font-size="19" fill="#0f62fe">Getting Started with Artificial Intelligence</text>

  <!-- Divider Line -->
  <line x1="45" y1="260" x2="550" y2="260" stroke="#c6c6c6" stroke-width="1" />

  <!-- Verification & Date Info -->
  <g transform="translate(45, 275)">
    <!-- QR Code Mockup -->
    <rect x="0" y="5" width="45" height="45" fill="#161616" rx="4" />
    <rect x="5" y="10" width="12" height="12" fill="#ffffff" />
    <rect x="28" y="10" width="12" height="12" fill="#ffffff" />
    <rect x="5" y="33" width="12" height="12" fill="#ffffff" />
    <rect x="22" y="26" width="6" height="6" fill="#ffffff" />
    <rect x="32" y="33" width="8" height="8" fill="#ffffff" />

    <!-- Text details -->
    <text x="58" y="18" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#161616">Issued on: <tspan font-weight="400" fill="#525252">Aug 18, 2026</tspan></text>
    <text x="58" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#161616">Issued by: <tspan font-weight="700" fill="#0043ce">IBM SkillsBuild</tspan></text>
    <text x="58" y="48" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#0062ff">Credly ID: a3aa8984-b8c5-4b84-8140-0664c4903df2</text>
  </g>

  <!-- Official IBM 8-bar Logo Vector -->
  <g transform="translate(460, 285) scale(0.65)">
    <!-- IBM striped letter shapes -->
    <!-- I -->
    <rect x="0" y="0" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="8" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="16" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="24" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="32" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="40" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="48" width="22" height="4" fill="#0f62fe" />
    <rect x="0" y="56" width="22" height="4" fill="#0f62fe" />

    <!-- B -->
    <g transform="translate(32, 0)">
      <path d="M0,0 H28 C34,0 38,3 38,8 C38,12 35,15 30,16 C36,17 40,20 40,26 C40,32 35,36 28,36 H0 Z" fill="none" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="0" x2="30" y2="0" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="8" x2="36" y2="8" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="16" x2="32" y2="16" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="24" x2="38" y2="24" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="32" x2="34" y2="32" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="40" x2="38" y2="40" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="48" x2="36" y2="48" stroke="#0f62fe" stroke-width="4" />
      <line x1="0" y1="56" x2="30" y2="56" stroke="#0f62fe" stroke-width="4" />
    </g>

    <!-- M -->
    <g transform="translate(85, 0)">
      <path d="M0,60 V0 L20,30 L40,0 V60" fill="none" stroke="#0f62fe" stroke-width="4" stroke-linecap="square" />
    </g>
  </g>
</svg>
